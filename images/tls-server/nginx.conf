worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 64;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log combined;
    sendfile      on;

    # TLS 1.2 — port 4443
    server {
        listen 4443 ssl;
        server_name tls-server.lab.local;

        ssl_certificate     /pki/server.cert.pem;
        ssl_certificate_key /pki/server.key.pem;
        ssl_protocols       TLSv1.2;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve      P-256;

        ssl_verify_client       on;
        ssl_client_certificate  /pki/ca-chain.pem;
        ssl_verify_depth        2;

        location / {
            add_header X-TLS-Version $ssl_protocol always;
            add_header X-TLS-Cipher  $ssl_cipher always;
            add_header X-Client-CN   $ssl_client_s_dn always;
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }

    # TLS 1.3 — port 4444
    server {
        listen 4444 ssl;
        server_name tls-server.lab.local;

        ssl_certificate     /pki/server.cert.pem;
        ssl_certificate_key /pki/server.key.pem;
        ssl_protocols       TLSv1.3;
        ssl_conf_command      Ciphersuites TLS_AES_256_GCM_SHA384;
        ssl_conf_command      SignatureAlgorithms ecdsa_secp256r1_sha256;
        ssl_ecdh_curve        P-256;

        ssl_verify_client       on;
        ssl_client_certificate  /pki/ca-chain.pem;
        ssl_verify_depth        2;

        location / {
            add_header X-TLS-Version $ssl_protocol always;
            add_header X-TLS-Cipher  $ssl_cipher always;
            add_header X-Client-CN   $ssl_client_s_dn always;
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /healthz {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
